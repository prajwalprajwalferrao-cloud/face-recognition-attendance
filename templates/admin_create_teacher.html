{% extends 'base.html' %}
{% block title %}Provision Teacher · FaceTrack Admin{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/portals.css') }}" />
{% endblock %}

{% block content %}
<div class="portal-page" style="max-width:680px; margin:0 auto;">

  <!-- Header -->
  <div class="portal-header">
    <div>
      <h1 class="portal-title">👩‍🏫 Provision Teacher Account</h1>
      <p class="portal-sub">Teachers receive attendance log viewing & CSV report export permissions.</p>
    </div>
  </div>

  <!-- Form Card -->
  <div class="glass portal-card" style="padding:2.25rem;">
    <form method="POST" action="{{ url_for('admin_create_teacher') }}">
      <div class="field">
        <label for="username">Teacher Username</label>
        <input id="username" name="username" type="text" required autofocus
               placeholder="e.g. prof_sharma" />
      </div>

      <div class="field">
        <label for="name">Full Name</label>
        <input id="name" name="name" type="text" required
               placeholder="e.g. Dr. Priya Sharma" />
      </div>

      <div class="field">
        <label for="class_name">Assigned Class / Department (optional)</label>
        <input id="class_name" name="class_name" type="text"
               placeholder="e.g. CS-A, Computer Science" />
      </div>

      <div class="field">
        <label for="password">Account Password</label>
        <input id="password" name="password" type="password" required minlength="6"
               placeholder="At least 6 characters" />
      </div>

      <div style="display:flex; gap:1rem; margin-top:1.5rem; align-items:center;">
        <button type="submit" class="btn btn-primary" style="flex:1;">
          Create Teacher Account →
        </button>
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-ghost">
          Cancel
        </a>
      </div>
    </form>
  </div>

</div>
{% endblock %}
