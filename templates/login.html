<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In · FaceTrack AI</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}" />
</head>
<body class="login-body">

  <div class="auth-container">
    <div class="auth-brand">
      <a href="{{ url_for('landing') }}">FaceTrack <span>AI</span></a>
    </div>

    <div class="auth-card-clean">
      <!-- Flash messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
        <div style="padding:10px 14px; background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color:#ef4444; border-radius:6px; font-size:0.88rem; margin-bottom:1.25rem;">
          {{ msg }}
        </div>
        {% endfor %}
      {% endif %}
      {% endwith %}

      <h1 class="auth-title">Sign in</h1>
      <p class="auth-sub">Enter your credentials to access your account.</p>

      <form method="POST" action="{{ url_for('login') }}" class="auth-form">
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required autofocus placeholder="Username" class="form-input" />
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••" class="form-input" />
        </div>

        <button type="submit" class="btn-auth-primary">Sign in →</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="{{ url_for('register') }}">Create account</a>
      </div>

      <div class="auth-back">
        <a href="{{ url_for('landing') }}">← Back to home</a>
      </div>
    </div>
  </div>

</body>
</html>
