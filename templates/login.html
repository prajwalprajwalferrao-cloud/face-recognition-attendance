<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In · FaceTrack AI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}" />
</head>
<body class="auth-body">
  <div class="bg-grid" aria-hidden="true"></div>

  <div class="auth-container">
    <div class="auth-brand">
      <a href="{{ url_for('landing') }}">FaceTrack<span style="color: var(--accent);">_AI</span></a>
    </div>

    <div class="bracket-frame">
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
        <div class="sys-flash {% if category == 'error' %}error{% endif %}">
          {{ msg }}
        </div>
        {% endfor %}
      {% endif %}
      {% endwith %}

      <h1 class="auth-title">System Login</h1>
      <p class="auth-sub">Enter credentials to verify identity.</p>

      <form method="POST" action="{{ url_for('login') }}" class="auth-form">
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required autofocus class="form-input" />
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required class="form-input" />
        </div>

        <button type="submit" class="btn-sys" style="width: 100%; margin-top: 0.5rem;">Authenticate →</button>
      </form>

      <div class="auth-footer">
        UNREGISTERED? <a href="{{ url_for('register') }}">ENROL FACE</a>
      </div>
      <div class="auth-footer" style="margin-top: 0.5rem;">
        <a href="{{ url_for('landing') }}" style="color: var(--text-muted);">&larr; ABORT</a>
      </div>
    </div>
  </div>
</body>
</html>
